spring.application.name=crypto-portfolio-tracker

# db connection
spring.datasource.url=jdbc:mysql://localhost:3306/crypto_portfolio_db
spring.datasource.username=springstudent
spring.datasource.password=springstudent

spring.jpa.hibernate.ddl-auto=create

# spring boot banner/logging
spring.main.banner-mode=off
logging.level.root=warn

# Jpa
spring.jpa.open-in-view=false

# Netty webClient on macos
logging.level.io.netty=ERROR

#api key
crypto.api.key=${CRYPTO_API_KEY}

# security
logging.level.org.springframework.security=TRACE
